AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ShoppersMart - S3 static website + images bucket with CloudFront CDN and AWS WAF protection.
  Creates a website S3 bucket and a dedicated images S3 bucket, both with Transfer Acceleration
  enabled and public access fully blocked. CloudFront serves both buckets via separate origins
  using Origin Access Control (OAC). The images bucket has Lifecycle Rules to transition objects
  to Standard-IA after 60 days and Glacier after 180 days. WAF protects the distribution with
  SQL injection and known bad inputs managed rule groups.
  NOTE: This stack must be deployed to us-east-1 because CloudFront-scoped WAF WebACLs
  are only supported in that region.

# ===========================================================
# PARAMETERS
# ===========================================================
Parameters:

  BucketName:
    Type: String
    Description: >
      Globally unique name for the S3 website bucket.
      Must be lowercase letters, numbers, and hyphens only (3-63 characters).
    AllowedPattern: "^[a-z0-9][a-z0-9\\-]{1,61}[a-z0-9]$"
    ConstraintDescription: >
      Must be 3-63 characters, lowercase alphanumeric and hyphens,
      cannot start or end with a hyphen.

  ImagesBucketName:
    Type: String
    Description: >
      Globally unique name for the dedicated images S3 bucket.
      Must be lowercase letters, numbers, and hyphens only (3-63 characters).
    AllowedPattern: "^[a-z0-9][a-z0-9\\-]{1,61}[a-z0-9]$"
    ConstraintDescription: >
      Must be 3-63 characters, lowercase alphanumeric and hyphens,
      cannot start or end with a hyphen.

  IndexDocument:
    Type: String
    Default: index.html
    Description: The default root document of the website.

  ErrorDocument:
    Type: String
    Default: index.html
    Description: >
      The document returned for 4xx errors.
      Using index.html lets client-side routing handle unknown paths.

  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: >
      CloudFront price class.
      PriceClass_100 uses only North America and Europe edge locations (lowest cost).
      PriceClass_200 adds Asia, Middle East, and Africa.
      PriceClass_All uses all edge locations globally.

  EnableWAF:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Set to true to create and attach the WAF WebACL with SQL injection protection.
      Set to false to skip WAF (e.g. for cost-sensitive dev environments).

# ===========================================================
# CONDITIONS
# ===========================================================
Conditions:

  IsUsEast1: !Equals [!Ref "AWS::Region", "us-east-1"]

  CreateWAF: !And
    - !Equals [!Ref EnableWAF, "true"]
    - !Condition IsUsEast1

# ===========================================================
# RESOURCES
# ===========================================================
Resources:

  # -----------------------------------------------------------
  # S3 Website Bucket
  # Static website hosting, public access BLOCKED,
  # Transfer Acceleration ENABLED for faster uploads.
  # -----------------------------------------------------------
  ShoppersMartBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName

      WebsiteConfiguration:
        IndexDocument: !Ref IndexDocument
        ErrorDocument: !Ref ErrorDocument

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      # Transfer Acceleration - allows uploads to use the nearest
      # CloudFront edge location for faster transfers to this bucket.
      AccelerateConfiguration:
        AccelerationStatus: Enabled

      # S3 request metrics - required for AllRequests CloudWatch metric.
      MetricsConfigurations:
        - Id: EntireBucket

      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3600

      Tags:
        - Key: Project
          Value: ShoppersMart
        - Key: Environment
          Value: Production

  # -----------------------------------------------------------
  # Website Bucket Policy - CloudFront OAC access only
  # -----------------------------------------------------------
  ShoppersMartBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ShoppersMartBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACGetObject
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${BucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistId}"
                  - DistId: !GetAtt ShoppersMartDistribution.Id

  # -----------------------------------------------------------
  # S3 Images Bucket
  # Dedicated bucket for product images, public access BLOCKED.
  # Transfer Acceleration ENABLED for faster image uploads.
  # Lifecycle Rules transition objects to cheaper storage tiers
  # after 60 days (Standard-IA) and 180 days (Glacier).
  # -----------------------------------------------------------
  ShoppersMartImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ImagesBucketName

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      # Transfer Acceleration - allows uploads to use the nearest
      # CloudFront edge location for faster transfers to this bucket.
      AccelerateConfiguration:
        AccelerationStatus: Enabled

      # Lifecycle Rules - automatically move images to cheaper storage
      # tiers as they age, reducing costs without deleting content.
      LifecycleConfiguration:
        Rules:
          - Id: ImagesStorageTiering
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 60
              - StorageClass: GLACIER
                TransitionInDays: 180

      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 86400

      Tags:
        - Key: Project
          Value: ShoppersMart
        - Key: BucketPurpose
          Value: ProductImages
        - Key: Environment
          Value: Production

  # -----------------------------------------------------------
  # Images Bucket Policy - CloudFront OAC access only
  # -----------------------------------------------------------
  ShoppersMartImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ShoppersMartImagesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACGetObject
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${ImagesBucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistId}"
                  - DistId: !GetAtt ShoppersMartDistribution.Id

  # -----------------------------------------------------------
  # OAC for the Website Bucket
  # -----------------------------------------------------------
  ShoppersMartOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-website-oac"
        Description: !Sub "OAC for ShoppersMart website bucket - ${AWS::StackName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # -----------------------------------------------------------
  # OAC for the Images Bucket
  # A separate OAC is required because each OAC is bound to a
  # single origin; one OAC cannot be shared across two buckets.
  # -----------------------------------------------------------
  ShoppersMartImagesOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ImagesBucketName}-oac"
        Description: !Sub "OAC for ShoppersMart images bucket - ${ImagesBucketName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # -----------------------------------------------------------
  # WAF WebACL - SQL injection and known bad inputs protection
  # -----------------------------------------------------------
  ShoppersMartWebACL:
    Type: AWS::WAFv2::WebACL
    Condition: CreateWAF
    Properties:
      Name: shoppersmart-website-996178-waf
      Scope: CLOUDFRONT
      Description: WAF WebACL for ShoppersMart CloudFront distribution
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: shoppersmart-website-996178-waf
      Rules:
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesSQLiRuleSet
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesKnownBadInputsRuleSet
      Tags:
        - Key: Project
          Value: ShoppersMart
        - Key: Environment
          Value: Production

  # -----------------------------------------------------------
  # CloudFront Distribution
  #
  # Two origins:
  #   S3Origin       - website bucket (default behaviour)
  #   S3ImagesOrigin - images bucket  (/images/* path pattern)
  #
  # Requests to /images/* are routed to the images bucket.
  # All other requests go to the website bucket.
  # Both origins use OAC for authenticated S3 access.
  # -----------------------------------------------------------
  ShoppersMartDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - ShoppersMartBucket
      - ShoppersMartImagesBucket
    Properties:
      DistributionConfig:
        Comment: !Sub "ShoppersMart CDN - ${BucketName}"
        Enabled: true
        HttpVersion: http2and3
        PriceClass: !Ref PriceClass

        WebACLId: !If
          - CreateWAF
          - !GetAtt ShoppersMartWebACL.Arn
          - !Ref "AWS::NoValue"

        DefaultRootObject: !Ref IndexDocument

        Origins:
          # Origin 1 - static website files
          - Id: S3Origin
            DomainName: !Sub "${BucketName}.s3.${AWS::Region}.amazonaws.com"
            OriginAccessControlId: !GetAtt ShoppersMartOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""

          # Origin 2 - product images bucket
          - Id: S3ImagesOrigin
            DomainName: !Sub "${ImagesBucketName}.s3.${AWS::Region}.amazonaws.com"
            OriginAccessControlId: !GetAtt ShoppersMartImagesOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""

        # Default behaviour - serves website files from S3Origin
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD

        # /images/* behaviour - routes to the images bucket.
        # Uses a longer TTL (1 day) since product images change
        # infrequently compared to HTML/CSS/JS files.
        CacheBehaviors:
          - PathPattern: "/images/*"
            TargetOriginId: S3ImagesOrigin
            ViewerProtocolPolicy: redirect-to-https
            # CachingOptimized managed policy - 24h default TTL
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
            Compress: true
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: !Sub "/${ErrorDocument}"
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: !Sub "/${ErrorDocument}"
            ErrorCachingMinTTL: 10

      Tags:
        - Key: Project
          Value: ShoppersMart
        - Key: Environment
          Value: Production

  # -----------------------------------------------------------
  # CloudWatch Dashboard
  # -----------------------------------------------------------
  ShoppersMartDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-dashboard"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CloudFront Requests",
                "view": "timeSeries",
                "stacked": false,
                "stat": "Sum",
                "period": 300,
                "region": "us-east-1",
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "Requests",
                    "DistributionId", "${ShoppersMartDistribution}",
                    "Region", "Global",
                    { "label": "Requests (5-min sum)", "color": "#1f77b4" }
                  ]
                ],
                "yAxis": { "left": { "min": 0, "label": "Requests", "showUnits": false } },
                "legend": { "position": "bottom" }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "S3 AllRequests",
                "view": "timeSeries",
                "stacked": false,
                "stat": "Sum",
                "period": 300,
                "region": "${AWS::Region}",
                "metrics": [
                  [
                    "AWS/S3",
                    "AllRequests",
                    "BucketName", "${BucketName}",
                    "FilterId", "EntireBucket",
                    { "label": "All S3 Requests (5-min sum)", "color": "#ff7f0e" }
                  ]
                ],
                "yAxis": { "left": { "min": 0, "label": "Requests", "showUnits": false } },
                "legend": { "position": "bottom" }
              }
            }
          ]
        }

# ===========================================================
# OUTPUTS
# ===========================================================
Outputs:

  CloudFrontURL:
    Description: CloudFront distribution URL - use this as your website address
    Value: !Sub "https://${ShoppersMartDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontURL"

  CloudFrontDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt ShoppersMartDistribution.DomainName
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDomainName"

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (needed for cache invalidations)
    Value: !GetAtt ShoppersMartDistribution.Id
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDistributionId"

  ImagesCloudFrontPath:
    Description: CloudFront path prefix for product images - reference images as this URL + /images/filename.jpg
    Value: !Sub "https://${ShoppersMartDistribution.DomainName}/images"
    Export:
      Name: !Sub "${AWS::StackName}-ImagesCloudFrontPath"

  WAFWebACLArn:
    Description: ARN of the WAF WebACL attached to the CloudFront distribution
    Condition: CreateWAF
    Value: !GetAtt ShoppersMartWebACL.Arn
    Export:
      Name: !Sub "${AWS::StackName}-WAFWebACLArn"

  WAFWebACLId:
    Description: ID of the WAF WebACL
    Condition: CreateWAF
    Value: !GetAtt ShoppersMartWebACL.Id
    Export:
      Name: !Sub "${AWS::StackName}-WAFWebACLId"

  WebsiteURL:
    Description: S3 static website endpoint (direct access blocked - reference only)
    Value: !GetAtt ShoppersMartBucket.WebsiteURL
    Export:
      Name: !Sub "${AWS::StackName}-WebsiteURL"

  BucketName:
    Description: Name of the website S3 bucket
    Value: !Ref ShoppersMartBucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"

  BucketArn:
    Description: ARN of the website S3 bucket
    Value: !GetAtt ShoppersMartBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BucketArn"

  ImagesBucketName:
    Description: Name of the images S3 bucket
    Value: !Ref ShoppersMartImagesBucket
    Export:
      Name: !Sub "${AWS::StackName}-ImagesBucketName"

  ImagesBucketArn:
    Description: ARN of the images S3 bucket
    Value: !GetAtt ShoppersMartImagesBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ImagesBucketArn"

  ImagesBucketAcceleratedEndpoint:
    Description: >
      Transfer Acceleration endpoint for the images bucket.
      Use this endpoint (instead of the standard endpoint) when uploading
      images for the fastest transfer speed via CloudFront edge locations.
    Value: !Sub "${ImagesBucketName}.s3-accelerate.amazonaws.com"
    Export:
      Name: !Sub "${AWS::StackName}-ImagesBucketAcceleratedEndpoint"

  WebsiteBucketAcceleratedEndpoint:
    Description: >
      Transfer Acceleration endpoint for the website bucket.
      Use this endpoint when deploying website files for fastest uploads.
    Value: !Sub "${BucketName}.s3-accelerate.amazonaws.com"
    Export:
      Name: !Sub "${AWS::StackName}-WebsiteBucketAcceleratedEndpoint"

  S3ConsoleURL:
    Description: Direct link to the website bucket in the AWS Console
    Value: !Sub "https://s3.console.aws.amazon.com/s3/buckets/${BucketName}"

  ImagesS3ConsoleURL:
    Description: Direct link to the images bucket in the AWS Console
    Value: !Sub "https://s3.console.aws.amazon.com/s3/buckets/${ImagesBucketName}"

  DashboardURL:
    Description: CloudWatch dashboard URL
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-dashboard"
    Export:
      Name: !Sub "${AWS::StackName}-DashboardURL"
